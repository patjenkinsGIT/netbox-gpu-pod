# Reference GPU Pod -- declarative spec
#
# This file describes the DESIRED END STATE of the pod. build_pod.py compares
# it against what NetBox currently holds and closes the gap. It is not a list
# of actions, and nothing here assumes a particular starting point.
#
# Numbers marked SOURCED come from NVIDIA's published reference architecture.
# Numbers marked ASSUMED are reasonable inferences that are NOT in those docs;
# they must stay labelled as such in the README.

meta:
  description: One NVIDIA DGX SuperPOD scalable unit (32x DGX H100, 12 racks)
  sources:
    architecture: https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/dgx-superpod-architecture.html
    components: https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/dgx-superpod-components.html
    electrical: https://docs.nvidia.com/dgx-superpod/design-guides/dgx-superpod-data-center-design-h100/latest/electrical.html

region:
  name: US-East
  slug: us-east

site:
  name: Reference Pod 1
  slug: reference-pod-1
  status: active
  description: Single DGX SuperPOD scalable unit -- reference model

location:
  name: Data Hall A
  slug: data-hall-a
  status: active

# SOURCED: SuperPOD racks must be EIA-310, at least 48U, minimum 600x1200mm.
# NVIDIA recommends 800x1200mm for cable management, rPDU placement, airflow
# and rear service clearance -- taken here, since 8 NDR400 rails per node plus
# storage, in-band, OOB and three power feeds make 600mm impractical.
rack_type:
  manufacturer: Vertiv
  manufacturer_slug: vertiv
  model: 48U 800x1200 Cabinet
  slug: 48u-800x1200-cabinet
  form_factor: 4-post-cabinet
  width: 19
  u_height: 48
  starting_unit: 1
  outer_width: 800
  outer_depth: 1200
  outer_unit: mm
  max_weight: 1360
  weight_unit: kg

# Device types. Component names use the same [start-end] range syntax the
# NetBox UI offers, but note the REST API does NOT expand it -- build_pod.py
# expands these itself before creating templates one by one.
#
# Power modelling follows the same rule used for the DGX H100:
#   allocated_draw = total draw / number of PSUs     (normal operation)
#   maximum_draw   = total draw / PSUs required      (worst case, others lost)
# For 2-PSU switches where either supply can carry the box, that means
# allocated = total/2 and maximum = total.
device_types:

  # SOURCED: 8U, 10.2 kW, 130.45 kg, 6 PSUs in 4+2 (four must be energised),
  # 8x NDR400 compute connections per system.
  # ASSUMED: 2 storage + 2 in-band NICs; the compute rails are sourced, these
  # counts are not. Naming deviates from real DGX names (ibp24s0 style) so the
  # rail-optimised mapping is self-documenting.
  - manufacturer: NVIDIA
    manufacturer_slug: nvidia
    model: DGX H100
    slug: dgx-h100
    u_height: 8
    full_depth: true
    weight: 130.45
    weight_unit: kg
    airflow: front-to-rear
    description: 8x H100, 640 GB GPU memory, 6 PSU 4+2
    power_ports:
      # 10.2 kW / 6 supplies = 1700 W allocated in normal operation.
      # 10.2 kW / 4 required = 2550 W maximum when two supplies are lost.
      # C20 because 2550 W exceeds C14/C13's 10 A (~2300 W at 230 V).
      - name: psu[1-6]
        type: iec-60320-c20
        maximum_draw: 2550
        allocated_draw: 1700
    interfaces:
      - name: ib-rail[0-7]
        type: infiniband-ndr-4x
      - name: ib-storage[0-1]
        type: infiniband-ndr-4x
      - name: inband[0-1]
        type: 100gbase-x-qsfp28
      - name: bmc
        type: 1000base-t
        mgmt_only: true

  # 0U vertical rPDU. SOURCED: NVIDIA specifies three rPDUs per rack for N+1
  # and names Vertiv/Geist among recommended vendors.
  #
  # CRITICAL: the `input` port carries NO draw values, deliberately. NetBox
  # aggregates downstream load through a pass-through power port ONLY when both
  # maximum_draw and allocated_draw are empty. Setting either makes it use the
  # declared value instead of computing from what is plugged in -- the feed then
  # reads 0 VA behind a healthy "Reachable" cable. The real 60 A rating lives in
  # the description, where it stays out of the arithmetic.
  # SOURCED: "Horizontal rPDUs are typically placed near the top of the rack",
  # and the electrical guide caps VERTICAL (0U) units at TWO per rack. Three
  # rPDUs therefore cannot all be 0U -- NVIDIA's own single-SU rack layout
  # mounts all three horizontally at the top. An earlier version of this spec
  # modelled three 0U vertical units, which contradicted a source already cited
  # here and made the rack's U accounting wrong.
  # ASSUMED: 2U per unit. The mounting position and orientation are sourced;
  # the exact height is not.
  - manufacturer: Vertiv
    manufacturer_slug: vertiv
    model: Geist 3P 415V 60A rPDU
    slug: geist-3p-415v-60a-rpdu
    u_height: 2
    full_depth: false
    airflow: passive
    description: 2U horizontal rPDU, 415 VAC 60 A three-phase
    power_ports:
      # The nulls are EXPLICIT, not omissions. Declaring them means the
      # reconcile pass can see and correct a value that has drifted -- an
      # omitted field would just mean "don't care", which is how a stale
      # maximum_draw of 34500 survived on this template and silently zeroed
      # the utilisation on all 33 generated rPDUs.
      - name: input
        maximum_draw: null
        allocated_draw: null
        description: 415 VAC 60 A three-phase, hardwired to panel
    power_outlets:
      - name: outlet[1-24]
        type: iec-60320-c19
        power_port: input

  # SOURCED: 1U, 32 OSFP cages presenting 64 NDR400 ports, 14.8 kg with 2 PSUs,
  # 200-240 VAC 10A. Power is published two ways: 747 W typical with PASSIVE
  # cables, 1720 W maximum with ACTIVE cables.
  #
  # DESIGN DECISION: we budget against 1720 W, not 747 W. Rail-optimised
  # topology puts leaf switches end-of-row (rail N from all 32 nodes must reach
  # the same leaf), and those runs exceed passive copper reach -- so this pod
  # runs optical, and the passive-cable typical figure does not apply to it.
  # The ToR-vs-EoR decision propagates straight into the power budget.
  - manufacturer: NVIDIA
    manufacturer_slug: nvidia
    model: QM9700
    slug: qm9700
    u_height: 1
    full_depth: true
    weight: 14.8
    weight_unit: kg
    airflow: front-to-rear
    description: Quantum-2 NDR 400G InfiniBand switch, 64 ports
    power_ports:
      - name: psu[1-2]
        type: iec-60320-c14
        maximum_draw: 1720
        allocated_draw: 860
    interfaces:
      # 64 logical NDR400 ports via 32 twin-port OSFP cages. Modelled as 64
      # discrete interfaces because cabling and rail mapping are per-port.
      - name: port[1-64]
        type: infiniband-ndr-4x

  # SOURCED: 88 mm high = 2U (NOT 1U), 64x QSFP28 100GbE, 466 W typical,
  # 14.64 kg. NVIDIA publishes no maximum, so maximum_draw is derived from
  # typical under the same 2-PSU rule rather than invented.
  - manufacturer: NVIDIA
    manufacturer_slug: nvidia
    model: SN4600C
    slug: sn4600c
    u_height: 2
    full_depth: true
    weight: 14.64
    weight_unit: kg
    airflow: front-to-rear
    description: Spectrum-3 100GbE switch, 64 ports -- in-band management fabric
    power_ports:
      - name: psu[1-2]
        type: iec-60320-c14
        maximum_draw: 466
        allocated_draw: 233
    interfaces:
      - name: eth[1-64]
        type: 100gbase-x-qsfp28

  # SOURCED: 43.9 mm = 1U, 48x RJ45 1GbE plus 4x QSFP28 100GbE uplinks,
  # 98 W typical, 7.41 kg.
  # ASSUMED: 2 PSUs -- redundancy is not stated in the specification page.
  - manufacturer: NVIDIA
    manufacturer_slug: nvidia
    model: SN2201
    slug: sn2201
    u_height: 1
    full_depth: false
    weight: 7.41
    weight_unit: kg
    airflow: front-to-rear
    description: Spectrum 1GbE management switch -- out-of-band / BMC fabric
    power_ports:
      - name: psu[1-2]
        type: iec-60320-c14
        maximum_draw: 98
        allocated_draw: 49
    interfaces:
      - name: eth[1-48]
        type: 1000base-t
      - name: uplink[1-4]
        type: 100gbase-x-qsfp28

  # SOURCED: 2U (88 mm), two hot-swap power supplies, InfiniBand ports plus an
  # Ethernet port for out-of-band management.
  #
  # This appliance belongs in the model for a specific reason: the architecture
  # page states a UFM PAIR displaces one DGX H100 in a full SuperPOD, which is
  # why the maximum is 127 systems rather than 128. It was cited in S1 and then
  # left out of the model until a comparison against NVIDIA's management-rack
  # figure caught the omission.
  #
  # ASSUMED: power draw. NVIDIA does not publish it on the pages consulted.
  - manufacturer: NVIDIA
    manufacturer_slug: nvidia
    model: UFM Enterprise Appliance
    slug: ufm-enterprise-appliance
    u_height: 2
    full_depth: true
    airflow: front-to-rear
    description: Unified Fabric Manager appliance -- deployed as a pair
    power_ports:
      - name: psu[1-2]
        type: iec-60320-c14
        maximum_draw: 800
        allocated_draw: 400
    interfaces:
      - name: ib[0-1]
        type: infiniband-ndr-4x
      - name: eth0
        type: 1000base-t
        mgmt_only: true

  # ENTIRELY ASSUMED. NVIDIA's reference architecture defers storage to
  # certified partners and publishes no reference storage node, so nothing
  # below is sourced. It exists so S01 is not an empty rack and so the storage
  # fabric has endpoints. Must be labelled as a placeholder in the README.
  - manufacturer: Generic
    manufacturer_slug: generic
    model: Storage Node (reference)
    slug: storage-node-reference
    u_height: 2
    full_depth: true
    airflow: front-to-rear
    description: PLACEHOLDER -- not from NVIDIA reference architecture
    power_ports:
      - name: psu[1-2]
        type: iec-60320-c14
        maximum_draw: 1600
        allocated_draw: 800
    interfaces:
      - name: ib-storage[0-1]
        type: infiniband-ndr-4x
      - name: eth[0-1]
        type: 100gbase-x-qsfp28
      - name: bmc
        type: 1000base-t
        mgmt_only: true

rack_roles:
  - name: Compute
    slug: compute
    color: "2196f3"
  - name: Network
    slug: network
    color: "4caf50"
  - name: Management
    slug: management
    color: "ff9800"
  - name: Storage
    slug: storage
    color: "9c27b0"

# 12 racks. SOURCED: an SU is up to 32 DGX H100 at 4 systems per rack, so eight
# compute racks. Leaf switches sit in the network racks rather than top-of-rack
# because rail-optimised topology requires rail N from every node to land on the
# same leaf -- see docs/design-notes.md.
racks:
  - {name: C01, role: compute}
  - {name: C02, role: compute}
  - {name: C03, role: compute}
  - {name: C04, role: compute}
  - {name: C05, role: compute}
  - {name: C06, role: compute}
  - {name: C07, role: compute}
  - {name: C08, role: compute}
  - {name: N01, role: network}
  - {name: N02, role: network}
  - {name: M01, role: management}
  - {name: S01, role: storage}

# SOURCED: minimum three power sources per rack, N+1 where N=2, each source
# sized to support 50% of total peak load. Modelled as three separate panels
# rather than one panel with three breakers, because the guide's stronger
# option is three discrete UPS systems on independent distribution paths --
# one panel would look redundant while sharing a single point of failure.
power_panels:
  - Panel A
  - Panel B
  - Panel C

# SOURCED: preferred scheme is 415 VAC, 60 A, three-phase, N+1, 80% derate.
# NetBox computes capacity as 415 x 60 x sqrt(3) x 0.80 = 34,501 VA. NVIDIA's
# table lists the same circuit at 32.7 kW -- a real discrepancy from a
# different derating assumption. Both figures are reported in the README
# rather than silently picking one.
power_feeds:
  name_template: "{rack}-{letter}"
  panels: [Panel A, Panel B, Panel C]
  letters: [A, B, C]
  supply: ac
  phase: three-phase
  voltage: 415
  amperage: 60
  max_utilization: 80
  type: primary
  status: active

# Every device PSU is cabled to an outlet on one of its rack's three rPDUs.
#
# A 6-PSU DGX H100 spreads a,a,b,b,c,c -- two supplies per source, so losing
# any one source costs exactly two supplies and leaves the four the system
# requires (4+2). A 2-PSU switch cannot touch all three sources, so its
# starting source rotates per device; otherwise every switch would land on
# a and b and source c would sit idle.
power_cabling:
  outlets_per_pdu: 24

# Fabric cabling.
#
# RAIL-OPTIMISED is the whole point: rail N on EVERY node lands on leaf N.
# Node 1's rail 3 and node 32's rail 3 both terminate on leaf-04, so a
# collective across rail 3 crosses one switch instead of traversing the spine.
# This is also why leaves are end-of-row rather than top-of-rack -- a ToR leaf
# could only ever see the four nodes in its own rack.
#
# Lengths are NOMINAL, pending a floor plan. They are declared so the S6 cable
# schedule has a length column and so the 30 m InfiniBand guidance can be
# checked. SOURCED: multimode optical must not exceed 50 m total travel, and
# NVIDIA recommends staying under 30 m for optimum performance.
fabric_cabling:
  compute_rails:
    # 8 rails x 32 nodes = 256 cables. Leaf ports 1-32 are downlinks.
    cable_type: mmf-om4
    length_m: 25
  uplinks:
    # Each leaf has 64 ports: 32 down to nodes, 32 up to spines. Four spines
    # means 8 links per leaf-spine pair, which is a 1:1 non-blocking fabric
    # and exactly consumes all 64 ports on every spine (8 leaf x 8 links).
    per_leaf_spine_pair: 8
    leaf_uplink_start_port: 33
    cable_type: aoc
    length_m: 5
  storage:
    cable_type: mmf-om4
    length_m: 20
  in_band:
    cable_type: mmf-om4
    length_m: 20
  out_of_band:
    cable_type: cat6a
    length_m: 30

device_roles:
  - {name: GPU Compute Node, slug: gpu-compute-node, color: "9c27b0"}
  - {name: Power Distribution, slug: power-distribution, color: "607d8b"}
  - {name: Compute Fabric Leaf, slug: compute-fabric-leaf, color: "2196f3"}
  - {name: Compute Fabric Spine, slug: compute-fabric-spine, color: "3f51b5"}
  - {name: Storage Fabric, slug: storage-fabric, color: "00bcd4"}
  - {name: Management Switch, slug: management-switch, color: "ff9800"}
  - {name: Storage Node, slug: storage-node, color: "795548"}
  - {name: Fabric Management, slug: fabric-management, color: "e91e63"}

# Devices are declared as GROUPS, not one entry each. 90 hand-written entries
# would be 90 chances to typo a rack unit; here the positions are arithmetic.
#
# name_template placeholders:
#   {rack}        rack name as written, e.g. C01
#   {rack_lower}  lowercased, e.g. c01
#   {n}           index within the rack, 1-based
#   {g}           index across the whole group, 1-based
#   {letter}      a, b, c ... from {n}
#
# Omit start_position for 0U devices -- they mount in the side channel and take
# no rack units, so NetBox holds them in the rack without an elevation slot.
device_groups:

  # SOURCED layout, from the white-space infrastructure guidance:
  #   - "servers should be mounted nearest the bottom of the rack, starting
  #      with the lowest position accessible by the server lift (usually rack
  #      unit position 3)"
  #   - "two servers grouped at the bottom of the rack, a 3 RU gap in the
  #      middle to aid in rack airflow management, and then two servers
  #      grouped above that"
  #
  # So: U3-U10, U11-U18, [3U airflow gap at U19-U21], U22-U29, U30-U37.
  # Positions are listed explicitly because the stride is NOT uniform -- the
  # airflow gap breaks it, and a uniform step cannot express that.
  #
  # NOTE what the free space is NOT. U1-U2 is below server-lift reach, U19-U21
  # is airflow, and the top is the rPDU zone. Every empty U is allocated; there
  # is no 8U contiguous slot for a fifth system. The rack layout already
  # encodes the power limit -- four systems draw 40.8 kW against circuits
  # topping out near 32.8 kW, so the density was decided upstream of the
  # elevation and the drawing simply reflects it.
  - description: 32x DGX H100, four per compute rack
    device_type: dgx-h100
    role: gpu-compute-node
    racks: [C01, C02, C03, C04, C05, C06, C07, C08]
    per_rack: 4
    name_template: "dgx-{rack_lower}-{n:02d}"
    positions: [3, 11, 22, 30]
    face: front

  # Three rPDUs in every rack, horizontal, near the top per NVIDIA's layout.
  # 2U each at U42/U44/U46, spanning U42-U47 and leaving U38-U41 clear above
  # the top DGX for cable management.
  - description: three horizontal rPDUs per rack for N+1
    device_type: geist-3p-415v-60a-rpdu
    role: power-distribution
    racks: [C01, C02, C03, C04, C05, C06, C07, C08, N01, N02, M01, S01]
    per_rack: 3
    name_template: "pdu-{rack_lower}-{letter}"
    positions: [42, 44, 46]
    face: front

  # SOURCED: 8 compute leaf switches per SU -- one per rail. Split across the
  # two network racks. End-of-row, not top-of-rack: rail N from all 32 nodes
  # must reach the SAME leaf, which makes ToR structurally impossible.
  - description: 8x QM9700 compute fabric leaf, one per rail
    device_type: qm9700
    role: compute-fabric-leaf
    racks: [N01, N02]
    per_rack: 4
    name_template: "leaf-{g:02d}"
    start_position: 1
    position_step: 1
    face: front

  # SOURCED: 4 spine switches per SU.
  - description: 4x QM9700 compute fabric spine
    device_type: qm9700
    role: compute-fabric-spine
    racks: [N01, N02]
    per_rack: 2
    name_template: "spine-{g:02d}"
    start_position: 10
    position_step: 1
    face: front

  # ASSUMED count -- NVIDIA names QM9700 for the storage fabric but the RA
  # defers sizing to the storage partner.
  - description: 2x QM9700 storage fabric
    device_type: qm9700
    role: storage-fabric
    racks: [S01]
    per_rack: 2
    name_template: "stor-fabric-{g:02d}"
    start_position: 1
    position_step: 1
    face: front

  # SOURCED device, ASSUMED count. SN4600C is 2U, hence the step of 2.
  - description: 2x SN4600C in-band management fabric
    device_type: sn4600c
    role: management-switch
    racks: [M01]
    per_rack: 2
    name_template: "inband-{g:02d}"
    start_position: 1
    position_step: 2
    face: front

  # 48 x 1GbE per switch; 32 DGX BMCs plus switch and storage BMCs exceed one.
  - description: 2x SN2201 out-of-band / BMC fabric
    device_type: sn2201
    role: management-switch
    racks: [M01]
    per_rack: 2
    name_template: "oob-{g:02d}"
    start_position: 10
    position_step: 1
    face: front

  # A pair, per the reference architecture. M01 has SN4600C at U1-U4 and
  # SN2201 at U10-U11, so U6 and U8 are free.
  #
  # NOTE their InfiniBand ports are deliberately left uncabled -- see
  # docs/design-notes.md. A strictly 1:1 non-blocking leaf-spine consumes every
  # port on every switch (32 down + 32 up per leaf; 8 leaf x 8 links fills all
  # 64 spine ports), leaving nowhere to attach a management appliance. Real
  # deployments reserve fabric ports for this, at the cost of slight
  # oversubscription. Modelling the appliance without inventing free ports
  # makes that trade-off visible instead of hiding it.
  - description: UFM appliance pair -- compute and storage fabric management
    device_type: ufm-enterprise-appliance
    role: fabric-management
    racks: [M01]
    per_rack: 2
    name_template: "ufm-{g:02d}"
    positions: [6, 8]
    face: front

  # ENTIRELY ASSUMED -- placeholder so S01 is not empty and the storage fabric
  # has endpoints. Not from NVIDIA's reference architecture.
  - description: 4x placeholder storage nodes
    device_type: storage-node-reference
    role: storage-node
    racks: [S01]
    per_rack: 4
    name_template: "storage-{g:02d}"
    start_position: 5
    position_step: 2
    face: front
